---
# Rundeck のジョブ定義(プロジェクト infra)。書式は Rundeck のジョブ定義(JSON/YAML)と同じ
# - schedule.crontab は Quartz 形式(秒 分 時 日 月 曜日 年)。7#2=第2土曜、7#4=第4土曜、L=月末日
# - scheduleEnabled: true のジョブは Rundeck が自動で実行する(対象ホストの cron の同じ行は止めておくこと)
# - nodefilters.filter の対象が複数のときは、カンマ区切り(空白なし)で書き、
#   nodefilters.dispatch.threadcount を台数にする(cron は各ホストが同時に実行するため)
rundeck_jobs:
  - name: update-2sat-1500
    group: package
    uuid: 06ade4b1-2617-4ad7-a520-70a420d20991
    description: "Package update (package_update.sh), 2nd Saturday 15:00"
    loglevel: INFO
    executionEnabled: true
    scheduleEnabled: true
    schedule:
      crontab: "0 0 15 ? * 7#2 *"
    nodefilters:
      filter: "name: ntp001,ntp002,ntp003"
      dispatch:
        threadcount: "3"
        keepgoing: true
    nodesSelectedByDefault: true
    sequence:
      keepgoing: false
      strategy: node-first
      commands:
        - exec: "sudo /bin/sh -c /usr/local/script/package_update.sh > /dev/null"


  - name: flag-reboot-sun-0058
    group: reboot
    uuid: d048c614-410d-45eb-9ba8-1c42b4ef9573
    description: "make_flagfile.sh 00:58 (day 9-15) and stop.sh reboot 00:59 (day 9-15, 23-29), Sunday. Starts 00:57 and waits on the node clock"
    loglevel: INFO
    executionEnabled: true
    scheduleEnabled: true
    schedule:
      crontab: "0 57 0 ? * 1 *"
    nodefilters:
      filter: "name: ntp001"
      dispatch:
        threadcount: "1"
        keepgoing: true
    nodesSelectedByDefault: true
    sequence:
      keepgoing: true
      strategy: node-first
      commands:
        - exec: "d=$(date +%-d); case $d in 9|1[0-5]) t=$(( $(date -d 00:58 +%s) - $(date +%s) )); if [ $t -gt 0 ]; then sleep $t; else echo late: $t sec; fi; sudo /usr/local/script/make_flagfile.sh > /dev/null ;; *) echo skip: day $d ;; esac"
        - exec: "d=$(date +%-d); case $d in 9|1[0-5]|2[3-9]) t=$(( $(date -d 00:59 +%s) - $(date +%s) )); if [ $t -gt 0 ]; then sleep $t; else echo late: $t sec; fi; sudo /usr/local/script/stop.sh reboot > /dev/null ;; *) echo skip: day $d ;; esac"


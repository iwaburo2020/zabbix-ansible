zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 1ac72f14bd4748ab89e9281aae4129b9
      name: 'Templates/Custom'
  templates:
    - uuid: 33cb2262aefb4086bfd17b6e4f8241ef
      template: 'ICMP-backup001'
      name: 'ICMP-backup001'
      description: 'backup001(wap001b にガジェットモードで接続)の死活監視。標準テンプレート ICMP Ping と同じ内容で、宛先を 192.168.250.1 に固定し、wap001b の ICMP 障害に依存させる'
      groups:
        - name: 'Templates/Custom'
      items:
        - uuid: 967f312032ae4afcb77c7ac1328921dc
          name: 'ICMP ping'
          type: SIMPLE
          key: 'icmpping[192.168.250.1]'
          valuemap:
            name: 'Service state'
          triggers:
            - uuid: 41501e0c6d0740e38c86e0959c98854e
              expression: 'max(/ICMP-backup001/icmpping[192.168.250.1],#3)=0'
              name: 'ICMP-backup001: Unavailable by ICMP ping'
              priority: HIGH
              dependencies:
                - name: 'ICMP Ping: Unavailable by ICMP ping'
                  expression: 'max(/wap001b/icmpping,#3)=0'
        - uuid: 87365ca90cbd4ba1b9376be849b73392
          name: 'ICMP loss'
          type: SIMPLE
          key: 'icmppingloss[192.168.250.1]'
          value_type: FLOAT
          units: '%'
          triggers:
            - uuid: cb6a276e7119423788159d091704109f
              expression: 'min(/ICMP-backup001/icmppingloss[192.168.250.1],5m)>{$ICMP_LOSS_WARN} and min(/ICMP-backup001/icmppingloss[192.168.250.1],5m)<100'
              name: 'ICMP-backup001: High ICMP ping loss'
              opdata: 'Loss: {ITEM.LASTVALUE1}'
              priority: WARNING
              dependencies:
                - name: 'ICMP-backup001: Unavailable by ICMP ping'
                  expression: 'max(/ICMP-backup001/icmpping[192.168.250.1],#3)=0'
        - uuid: 3b2d369d35594006b72d8ffc32cad342
          name: 'ICMP response time'
          type: SIMPLE
          key: 'icmppingsec[192.168.250.1]'
          value_type: FLOAT
          units: s
          triggers:
            - uuid: 91fc6edaafa544f5bf1fc09e112f1026
              expression: 'avg(/ICMP-backup001/icmppingsec[192.168.250.1],5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'ICMP-backup001: High ICMP ping response time'
              opdata: 'Value: {ITEM.LASTVALUE1}'
              priority: WARNING
              dependencies:
                - name: 'ICMP-backup001: High ICMP ping loss'
                  expression: 'min(/ICMP-backup001/icmppingloss[192.168.250.1],5m)>{$ICMP_LOSS_WARN} and min(/ICMP-backup001/icmppingloss[192.168.250.1],5m)<100'
                - name: 'ICMP-backup001: Unavailable by ICMP ping'
                  expression: 'max(/ICMP-backup001/icmpping[192.168.250.1],#3)=0'
      macros:
        - macro: '{$ICMP_LOSS_WARN}'
          value: '20'
        - macro: '{$ICMP_RESPONSE_TIME_WARN}'
          value: '0.15'
      valuemaps:
        - uuid: e17e0685f3474c81a05c62be5bd3fdde
          name: 'Service state'
          mappings:
            - value: '0'
              newvalue: Down
            - value: '1'
              newvalue: Up

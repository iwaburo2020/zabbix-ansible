  - Role/Zabbix
  - Role/DB
  - Role/NAS
  - Role/NTP
  - Role/GPS
  - Role/Web
  - Role/DNS
  - Role/Cache
  - Role/DHCP
  - Role/Proxy
  - Role/WAP
  - Role/Backup
  - Role/Log
  - OS/RaspberryPiOS
  - OS/Ubuntu
  - OS/Windows
  - OS/AlmaLinux
  - Network/Yamaha

# テンプレートグループ(独自テンプレート用)
zabbix_template_groups:
  - Templates/Custom

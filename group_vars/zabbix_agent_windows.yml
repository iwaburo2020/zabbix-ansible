---
# エージェント導入対象のうち Windows のホスト共通(OpenSSH、既定のシェルは OS 標準の cmd)
ansible_user: user
ansible_shell_type: cmd
ansible_become: false

# Linux のホストに導入したものと同じバージョン(zabbix-agent2 7.0.31)
zabbix_agent_win_version: "7.0.31"
zabbix_agent_win_msi_url: "https://cdn.zabbix.com/zabbix/binaries/stable/7.0/{{ zabbix_agent_win_version }}/zabbix_agent2-{{ zabbix_agent_win_version }}-windows-amd64-openssl.msi"
